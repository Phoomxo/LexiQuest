    <text class="t small center" x="195" y="548">Replay result แสดงแยกจาก mission best</text>
    <text class="t small" x="12" y="635">UX-P08 · Best/latest + replay isolation</text>
  </g>

  <!-- Adventure parity -->
  <g transform="translate(1335 790)">
    <rect class="panel" width="390" height="610" rx="24"/>
    <rect x="0" y="0" width="390" height="110" fill="#e0e7ff" stroke="#334155" stroke-width="2" rx="24"/>
