    <text class="t small" x="44" y="392">ไม่มีรางวัลเพิ่มจากความเร็ว</text>
    <text class="t small" x="24" y="452">เก็บไว้ทบทวนรอบถัดไป 1 คำ</text>
    <rect class="primary" x="24" y="478" width="342" height="58" rx="16"/>
    <text class="t btn white" x="195" y="514">ทำภารกิจต่อ</text>
    <text class="t small center" x="195" y="568">ไปหน้าทบทวน · ฝึกชุดนี้ซ้ำ</text>
    <text class="t small" x="12" y="635">UX-P07 · Stars separated from time/mastery</text>
  </g>

  <!-- P04 Focused -->
  <g transform="translate(485 790)">
    <rect class="panel" width="390" height="610" rx="24"/>
    <rect class="bar" width="390" height="64" rx="24"/>
    <text class="t ph" x="24" y="41">← เลือกความหมาย</text><text class="t small" x="318" y="41">1/4</text>
    <text class="t small" x="24" y="94">คำอังกฤษที่เลือก</text>
    <rect class="selected" x="24" y="110" width="342" height="74" rx="16"/>
    <text class="t ph" x="44" y="155">house</text><text class="t" x="320" y="155">🔊</text>
    <text class="t small" x="24" y="222">เลือกความหมายภาษาไทย</text>
    <rect class="card" x="24" y="238" width="342" height="64" rx="16"/><text class="t" x="44" y="278">บ้าน</text>
    <rect class="card" x="24" y="314" width="342" height="64" rx="16"/><text class="t" x="44" y="354">หนังสือ</text>
    <rect class="card" x="24" y="390" width="342" height="64" rx="16"/><text class="t" x="44" y="430">น้ำ</text>
    <rect class="secondary" x="24" y="478" width="342" height="58" rx="16"/>
