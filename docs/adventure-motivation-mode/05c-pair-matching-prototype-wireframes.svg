<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
  <title id="title">LexiQuest Pair Matching Prototype wireframes</title>
  <desc id="desc">Version 1.2 low-fidelity screens for setup, regular board, repair, timeout, result, focused accessibility layout, history replay and Adventure presentation parity.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#334155;stroke-width:2}.bar{fill:#e2e8f0}.card{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.selected{fill:#dbeafe;stroke:#1e88e5;stroke-width:3}.matched{fill:#dcfce7;stroke:#15803d;stroke-width:2}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.primary{fill:#1e88e5;stroke:#1565c0;stroke-width:1.5}.secondary{fill:#fff;stroke:#1e88e5;stroke-width:2}.disabled{fill:#e5e7eb;stroke:#94a3b8;stroke-width:1.5}.t{font-family:'Noto Sans Thai','Noto Sans',sans-serif;fill:#0f172a;font-size:18px}.small{font-size:14px;fill:#475569}.h{font-size:24px;font-weight:700}.ph{font-size:20px;font-weight:700}.btn{font-size:16px;font-weight:700;text-anchor:middle}.white{fill:#fff}.center{text-anchor:middle}.note{fill:#fffbeb;stroke:#d97706;stroke-width:1.5}.dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:7 5}
    </style>
  </defs>
  <rect class="bg" width="1800" height="1500"/>
  <text class="t h" x="60" y="45">LexiQuest — Pair Matching Prototype Standard (05C)</text>
  <text class="t small" x="60" y="72">v1.2 · f10 refinement · no new menu · Standard/Adventure share plan, engine, evidence and outcome policy</text>

  <!-- P01 Setup -->
  <g transform="translate(60 105)">
    <rect class="panel" width="390" height="610" rx="24"/>
    <rect class="bar" width="390" height="64" rx="24"/>
    <text class="t ph" x="24" y="41">← จับคู่คำ–ความหมาย</text>
    <text class="t small" x="24" y="94">TODAY MISSION · 6 คำที่ถึงเวลาทบทวน</text>
    <rect class="card" x="24" y="116" width="342" height="102" rx="16"/>
    <text class="t" x="44" y="151">จำนวนคู่จากโปรไฟล์</text>
    <text class="t h" x="44" y="191">6 คู่</text>
    <text class="t small" x="279" y="190">เปลี่ยนได้ในการตั้งค่า</text>
    <text class="t" x="24" y="258">ตัวจับเวลา</text>
    <rect class="selected" x="24" y="276" width="158" height="52" rx="14"/>
    <text class="t btn" x="103" y="309">ไม่จับเวลา</text>
    <rect class="card" x="194" y="276" width="52" height="52" rx="14"/><text class="t btn" x="220" y="309">60</text>
    <rect class="card" x="254" y="276" width="52" height="52" rx="14"/><text class="t btn" x="280" y="309">90</text>
    <rect class="card" x="314" y="276" width="52" height="52" rx="14"/><text class="t btn" x="340" y="309">120</text>
    <text class="t small" x="24" y="354">เวลาเป็นทางเลือก ไม่มีผลต่อดาวหรือรางวัล</text>
    <rect class="card" x="24" y="384" width="342" height="72" rx="16"/>
    <text class="t" x="44" y="416">ทิศทาง: อังกฤษ → ไทย</text>
    <text class="t small" x="44" y="442">หนึ่งทิศทางต่อ Learning Session</text>
    <rect class="primary" x="24" y="490" width="342" height="58" rx="16"/>
    <text class="t btn white" x="195" y="526">เริ่มจับคู่</text>
    <text class="t small center" x="195" y="579">ไว้ภายหลัง</text>
    <text class="t small" x="12" y="635">UX-P01/P02 · Entry + Setup</text>
  </g>

