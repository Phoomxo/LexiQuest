    <text class="t small" x="24" y="123">คำอังกฤษ</text><text class="t small" x="213" y="123">ความหมายไทย</text>
    <rect class="matched" x="24" y="138" width="164" height="58" rx="14"/><text class="t" x="42" y="174">✓ apple</text>
    <rect class="matched" x="202" y="138" width="164" height="58" rx="14"/><text class="t" x="220" y="174">✓ แอปเปิล</text>
    <rect class="selected" x="24" y="208" width="164" height="58" rx="14"/><text class="t" x="42" y="244">house</text>
    <rect class="card" x="202" y="208" width="164" height="58" rx="14"/><text class="t" x="220" y="244">น้ำ</text>
    <rect class="card" x="24" y="278" width="164" height="58" rx="14"/><text class="t" x="42" y="314">water</text>
    <rect class="card" x="202" y="278" width="164" height="58" rx="14"/><text class="t" x="220" y="314">บ้าน</text>
    <rect class="card" x="24" y="348" width="164" height="58" rx="14"/><text class="t" x="42" y="384">cat</text>
    <rect class="card" x="202" y="348" width="164" height="58" rx="14"/><text class="t" x="220" y="384">ภูเขา</text>
    <rect class="card" x="24" y="418" width="164" height="58" rx="14"/><text class="t" x="42" y="454">mountain</text>
    <rect class="card" x="202" y="418" width="164" height="58" rx="14"/><text class="t" x="220" y="454">แมว</text>
    <rect class="secondary" x="24" y="512" width="164" height="52" rx="14"/><text class="t btn" x="106" y="545">🔊 ฟังคำ</text>
    <rect class="secondary" x="202" y="512" width="164" height="52" rx="14"/><text class="t btn" x="284" y="545">คำใบ้</text>
    <text class="t small" x="12" y="635">UX-P03 · Regular two-column board</text>
  </g>

  <!-- P05 Repair -->
  <g transform="translate(910 105)">
    <rect class="panel" width="390" height="610" rx="24"/>
    <rect class="bar" width="390" height="64" rx="24"/>
    <text class="t ph" x="24" y="41">จับคู่ต่อ</text><text class="t small" x="314" y="41">2/6</text>
    <rect class="warn" x="24" y="92" width="342" height="156" rx="18"/>
    <text class="t ph" x="44" y="128">ยังไม่ใช่คู่นี้</text>
    <text class="t" x="44" y="164">ลองเก็บคำนี้ไว้ แล้วกลับมา</text>
    <text class="t" x="44" y="194">หลังฝึกคำอื่นอีก 3 คู่</text>
    <text class="t small" x="44" y="224">ความคืบหน้าเดิมไม่ถูกลด</text>
    <rect class="card" x="24" y="276" width="342" height="90" rx="16"/>
    <text class="t" x="44" y="309">house</text>
    <text class="t small" x="44" y="340">🔊 ฟังเสียง · ดูตัวอย่างสั้น ๆ</text>
    <path class="dash" d="M195 386 L195 466"/>
    <text class="t small center" x="195" y="416">repair ticket</text>
    <text class="t small center" x="195" y="440">due after 3 distinct pairs</text>
    <rect class="primary" x="24" y="490" width="342" height="58" rx="16"/>
    <text class="t btn white" x="195" y="526">ทำคู่ถัดไป</text>
    <text class="t small" x="12" y="635">UX-P05 · Non-shaming delayed repair</text>
  </g>

  <!-- P06 Timeout -->
  <g transform="translate(1335 105)">
    <rect class="panel" width="390" height="610" rx="24"/>
    <rect class="bar" width="390" height="250" rx="24"/>
    <text class="t small" x="24" y="42">จับคู่สำเร็จ 4/6 คู่</text>
    <rect x="0" y="220" width="390" height="390" fill="#fff" stroke="#334155" stroke-width="2" rx="24"/>
    <text class="t h" x="28" y="274">ยังไม่ทันเป้าหมาย</text>
    <text class="t h" x="28" y="306">แต่ทำต่อได้</text>
    <text class="t small" x="28" y="338">คำตอบและความคืบหน้ายังอยู่ครบ</text>
    <rect class="primary" x="28" y="370" width="334" height="58" rx="16"/>
    <text class="t btn white" x="195" y="406">ทำต่อโดยไม่จับเวลา</text>
    <rect class="secondary" x="28" y="442" width="334" height="58" rx="16"/>
