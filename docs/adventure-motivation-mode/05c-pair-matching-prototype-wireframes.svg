    <text class="t center" x="195" y="538">เริ่มรอบใหม่ด้วยคำชุดเดิม</text>
    <text class="t small center" x="195" y="568">สลับตำแหน่งใหม่ · ประวัติยังอยู่</text>
    <text class="t small" x="12" y="635">UX-P06 · Durable timeout decision</text>
  </g>

