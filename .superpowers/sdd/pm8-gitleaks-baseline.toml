title = "LexiQuest secret scanning policy"

[extend]
useDefault = true

[[allowlists]]
description = "Generated Firebase mobile client API identifiers are public configuration."
condition = "AND"
regexTarget = "match"
paths = [
  '''(?:^|/)lib/firebase_options\.dart$''',
  '''(?:^|/)android/app/google-services\.json$''',
]
regexes = ['''AIzaSy[A-Za-z0-9_-]{33}''']

[[allowlists]]
description = "Tokenizer argument names are not API credentials."
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)backend/lexiquest_lm/train/(?:tokenise_dataset|lora_finetune)\.py$''']
regexes = ['''tokenizer,\s+max_length=args\.max_length''']

[[allowlists]]
description = "SharedPreferences storage key is not a credential."
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)lib/services/achievement_service\.dart$''']
regexes = ['''lexiquest_achievements_v1''']

[[allowlists]]
description = "Network-policy test URL contains no credential."
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)test/config/app_config_test\.dart$''']
regexes = ['''api-key-secret-7c9f3a''']

[[allowlists]]
description = "AI URL validation test uses a fixed leak-canary sentinel."
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)backend/ai_api/tests/test_models\.py$''']
regexes = ['''hunter2-leak-canary-9f3c''']

[[allowlists]]
description = "Learner-preference sync lease is a fixed non-secret test fixture."
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)test/features/sync/learner_preferences_sync_test\.dart$''']
regexes = ['''v2-v1-replacement-lease''']

[[allowlists]]
description = "Fixed mock-client key; never sent to a live Gemini endpoint."
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)test/features/gemini/gemini_rest_gateway_test\.dart$''']
regexes = ['''^test-key-that-is-long-enough-123456$''']

[[allowlists]]
description = "Synthetic missing-provenance event idempotency identity, not a credential."
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)test/features/learning/drift_learning_event_store_test\.dart$''']
regexes = ['''^quest-v1-missing-provenance$''']

[[allowlists]]
description = "Fixed local sync lease identities in the SDK/store test harness."
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)test/features/sync/firestore_sync_gateway_test\.dart$''']
regexes = ['''^f20-saved-rollout$''', '''^f20-saved-long-id-rollout$''', '''^f20-saved-long-id-lease$''']

[[allowlists]]
description = "Synthetic reward idempotency identities, not authentication secrets."
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)test/features/sync/reward_transaction_sync_test\.dart$''']
regexes = ['''^exhausted-v2-purchase$''', '''^carried-v1-purchase$''', '''^carried-v1-funding$''', '''^eligible-v2-purchase$''', '''^tamper-evident-v2-purchase$''']
