version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Bangkok
    groups:
      minor-and-patch:
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    open-pull-requests-limit: 5
