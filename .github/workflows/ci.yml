name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.8'
          enable-cache: true

      - name: Provision Python 3.11
        run: uv python install 3.11

      - name: CLI contract tests
        shell: pwsh
        run: |
          ./tool/cli/tests/runtime-probes.tests.ps1
          ./tool/cli/tests/run-android.tests.ps1
          ./tool/cli/tests/verify-scope.tests.ps1
          ./tool/cli/tests/ci-workflow.tests.ps1
          ./tool/cli/tests/dependabot-config.tests.ps1
          ./tool/cli/tests/osv-pr-workflow.tests.ps1
          ./tool/cli/tests/osv-scheduled-workflow.tests.ps1
          ./tool/cli/tests/osv-config.tests.ps1
          ./tool/cli/tests/firebase-seed-security.tests.ps1
          ./tool/cli/tests/model-loading-security.tests.ps1
          ./tool/cli/tests/android-manifest-security.tests.ps1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install trusted writer dependencies
        run: npm --prefix functions ci --ignore-scripts

      - name: Provision Firebase CLI
        run: npm install -g firebase-tools@15.24.0 --ignore-scripts

      - name: Firestore emulator contract tests
        run: npm run test:rules

      - name: Trusted writer tests
        run: npm --prefix functions test

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: '2.109.1'

      - name: Supabase local database
        run: supabase db start

      - name: Supabase local schema reset
        run: supabase db reset --local --no-seed

      - name: Supabase local schema lint
        run: supabase db lint --local --level warning

      - name: Supabase local security advisors
        run: supabase db advisors --local --type security --level warn --fail-on error

      - name: Supabase storage security contract
        run: docker exec -i supabase_db_lexiquest-local psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < test/security/supabase_storage_contract.sql

      - name: Stop Supabase local database
        if: always()
        run: supabase stop --no-backup

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting (tracked sources only)
        run: |
          git ls-files '*.dart' \
            | grep -vE '(^|/)(build|\.dart_tool|generated|vendor|checkpoints?)(/|$)' \
            | xargs -r dart format --output=none --set-exit-if-changed

      - name: Flutter static analysis
        run: flutter analyze

      - name: Flutter unit and widget tests
        run: flutter test --reporter compact

      - name: Voice API CPU-only tests
        working-directory: backend/voice_api
        run: |
          uv sync --frozen --group dev --no-group gpu
          uv run --frozen --group dev --no-group gpu pytest tests -q --ignore=tests/integration

      - name: AI API CPU-only tests
        working-directory: backend/ai_api
        run: |
          uv sync --frozen --group dev
          uv run --frozen --group dev pytest tests -q -W error

      - name: LexiQuest-LM CPU-only tests
        working-directory: backend/lexiquest_lm
        run: |
          uv sync --frozen --group dev --no-group train
          uv run --frozen --group dev --no-group train pytest tests -q

      - name: Build Android debug APK
        env:
          LEXIQUEST_BUILD_ID: ${{ github.sha }}
          LEXIQUEST_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LEXIQUEST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "${LEXIQUEST_SUPABASE_PUBLISHABLE_KEY}"
          flutter build apk --debug \
            --dart-define=LEXIQUEST_VERSION=1.0.0+1 \
            --dart-define=LEXIQUEST_BUILD_ID=${LEXIQUEST_BUILD_ID} \
            --dart-define=LEXIQUEST_SUPABASE_PUBLISHABLE_KEY=${LEXIQUEST_SUPABASE_PUBLISHABLE_KEY} \
            --dart-define=LEXIQUEST_VOICE_API_URL=http://10.0.2.2:8001 \
            --dart-define=LEXIQUEST_AI_API_URL=http://10.0.2.2:8000
