name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.8'
          enable-cache: true

      - name: Provision Python 3.11
        run: uv python install 3.11

      - name: CLI contract tests
        shell: pwsh
        run: |
          ./tool/cli/tests/runtime-probes.tests.ps1
          ./tool/cli/tests/run-android.tests.ps1
          ./tool/cli/tests/ci-workflow.tests.ps1
          ./tool/cli/tests/dependabot-config.tests.ps1
          ./tool/cli/tests/osv-pr-workflow.tests.ps1
          ./tool/cli/tests/osv-scheduled-workflow.tests.ps1
          ./tool/cli/tests/osv-config.tests.ps1
          ./tool/cli/tests/firebase-seed-security.tests.ps1
          ./tool/cli/tests/model-loading-security.tests.ps1
          ./tool/cli/tests/android-manifest-security.tests.ps1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Provision Firebase CLI
        run: npm install -g firebase-tools@15.24.0

      - name: Firestore rules tests
        run: npm run test:rules

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting (tracked sources only)
        run: |
          git ls-files '*.dart' \
            | grep -vE '(^|/)(build|\.dart_tool|generated|vendor|checkpoints?)(/|$)' \
            | xargs -r dart format --output=none --set-exit-if-changed

      - name: Flutter static analysis
        run: flutter analyze

      - name: Flutter unit and widget tests
        run: flutter test --reporter compact

      - name: Voice API CPU-only tests
        working-directory: backend/voice_api
        run: |
          uv sync --frozen --group dev --no-group gpu
          uv run --frozen --group dev --no-group gpu pytest tests -q --ignore=tests/integration

      - name: AI API CPU-only tests
        working-directory: backend/ai_api
        run: |
          uv sync --frozen --group dev
          uv run --frozen --group dev pytest tests -q -W error

      - name: LexiQuest-LM CPU-only tests
        working-directory: backend/lexiquest_lm
        run: |
          uv sync --frozen --group dev --no-group train
          uv run --frozen --group dev --no-group train pytest tests -q

      - name: Build Android debug APK
        env:
          LEXIQUEST_BUILD_ID: ${{ github.sha }}
        run: |
          flutter build apk --debug \
            --dart-define=LEXIQUEST_VERSION=1.0.0+1 \
            --dart-define=LEXIQUEST_BUILD_ID=${LEXIQUEST_BUILD_ID} \
            --dart-define=LEXIQUEST_VOICE_API_URL=http://10.0.2.2:8001 \
            --dart-define=LEXIQUEST_AI_API_URL=http://10.0.2.2:8000
