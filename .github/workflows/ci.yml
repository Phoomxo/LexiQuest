name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.8'
          enable-cache: true

      - name: Provision Python 3.11
        run: uv python install 3.11

      - name: CLI contract tests
        shell: pwsh
        run: |
          ./tool/cli/tests/runtime-probes.tests.ps1
          ./tool/cli/tests/run-android.tests.ps1
          ./tool/cli/tests/firebase-auth-actions.tests.ps1
          ./tool/cli/tests/firebase-assetlinks-validator.tests.ps1
          ./tool/cli/tests/verify-scope.tests.ps1
          ./tool/cli/tests/ci-workflow.tests.ps1
          ./tool/cli/tests/dependabot-config.tests.ps1
          ./tool/cli/tests/osv-pr-workflow.tests.ps1
          ./tool/cli/tests/osv-scheduled-workflow.tests.ps1
          ./tool/cli/tests/osv-config.tests.ps1
          ./tool/cli/tests/firebase-seed-security.tests.ps1
          ./tool/cli/tests/model-loading-security.tests.ps1
          ./tool/cli/tests/android-manifest-security.tests.ps1
          ./tool/cli/tests/production-release-workflow.tests.ps1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install trusted writer dependencies
        run: npm --prefix functions ci --ignore-scripts

      - name: Provision Firebase CLI
        run: npm install -g firebase-tools@15.24.0 --ignore-scripts

      - name: Firestore emulator contract tests
        run: npm run test:rules

      - name: Trusted writer tests
        run: npm --prefix functions test

      - name: Trusted writer emulator tests
        run: npm run test:functions-emulator

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting (tracked sources only)
        run: |
          git ls-files '*.dart' \
            | grep -vE '(^|/)(build|\.dart_tool|generated|vendor|checkpoints?)(/|$)' \
            | xargs -r dart format --output=none --set-exit-if-changed

      - name: Flutter static analysis
        run: flutter analyze

      - name: Flutter focused account action-link tests
        run: flutter test test/account/account_models_test.dart test/navigation/account_link_coordinator_test.dart

      - name: Flutter account recovery integration test (Linux desktop)
        run: timeout --kill-after=5s 120s flutter test integration_test/account_lifecycle_test.dart -d linux --timeout 2m

      - name: Flutter unit and widget tests
        run: flutter test --reporter compact

      - name: Voice API CPU-only tests
        working-directory: backend/voice_api
        run: |
          uv sync --frozen --group dev --no-group gpu
          uv run --frozen --group dev --no-group gpu pytest tests -q --ignore=tests/integration

      - name: AI API CPU-only tests
        working-directory: backend/ai_api
        run: |
          uv sync --frozen --group dev
          uv run --frozen --group dev pytest tests -q -W error

      - name: LexiQuest-LM CPU-only tests
        working-directory: backend/lexiquest_lm
        run: |
          uv sync --frozen --group dev --no-group train
          uv run --frozen --group dev --no-group train pytest tests -q

      - name: Build Android debug APK
        env:
          LEXIQUEST_BUILD_ID: ${{ github.sha }}
        run: |
          flutter build apk --debug \
            --dart-define=LEXIQUEST_VERSION=0.1.0+1 \
            --dart-define=LEXIQUEST_BUILD_ID=${LEXIQUEST_BUILD_ID} \
            --dart-define=LEXIQUEST_VOICE_API_URL=http://10.0.2.2:8001 \
            --dart-define=LEXIQUEST_AI_API_URL=http://10.0.2.2:8000

      - name: Create ephemeral release signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "${RUNNER_TEMP}/lexiquest-ci-release.jks" \
            -storepass "lexiquest-ci-only" \
            -keypass "lexiquest-ci-only" \
            -alias "ephemeral" \
            -dname "CN=LexiQuest CI,OU=Verification,O=LexiQuest,C=TH" \
            -validity 2 \
            -keyalg RSA \
            -keysize 2048
          cat > android/key.properties <<EOF
          storeFile=${RUNNER_TEMP}/lexiquest-ci-release.jks
          storePassword=lexiquest-ci-only
          keyAlias=ephemeral
          keyPassword=lexiquest-ci-only
          EOF

      - name: Build signed release candidate smoke AAB
        env:
          LEXIQUEST_BUILD_ID: ${{ github.sha }}
        run: |
          flutter build appbundle --release \
            --dart-define=LEXIQUEST_VERSION=0.1.0+1 \
            --dart-define=LEXIQUEST_BUILD_ID=${LEXIQUEST_BUILD_ID} \
            --dart-define=LEXIQUEST_VOICE_API_URL=http://10.0.2.2:8001 \
            --dart-define=LEXIQUEST_AI_API_URL=http://10.0.2.2:8000
          signature_output="$(
            jarsigner -verify -verbose -certs \
              build/app/outputs/bundle/release/app-release.aab 2>&1
          )"
          printf '%s\n' "$signature_output"
          grep -q "jar verified." <<<"$signature_output"

      - name: Prepare SBOM directory
        run: mkdir -p build/sbom

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: build/sbom/source.cdx.json
          upload-artifact: false
          dependency-snapshot: false
          syft-version: v1.49.0

      - name: Generate release candidate artifact SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: build/app/outputs/bundle/release/app-release.aab
          format: cyclonedx-json
          output-file: build/sbom/release-candidate.cdx.json
          upload-artifact: false
          dependency-snapshot: false
          syft-version: v1.49.0

      - name: Upload release candidate SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-sbom-${{ github.sha }}
          path: build/sbom
          if-no-files-found: error
          retention-days: 14

      - name: Remove ephemeral signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "${RUNNER_TEMP}/lexiquest-ci-release.jks"
