[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexiquest-voice-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.140.0",
    "firebase-admin==7.5.0",
    "pydantic-settings==2.14.2",
    "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
    "httpx2==2.9.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
gpu = [
    "omnivoice==0.2.1",
    "soundfile==0.14.0",
    "torch==2.13.0+cu132",
    "torchaudio==2.11.0",
]

# OmniVoice 0.2.1 supports Torch and Torchaudio 2.4 or newer. Torch 2.13.0
# removes the known vulnerabilities in the prior 2.8.0 runtime. Torchaudio
# 2.11.0 no longer pins a matching Torch build, so it remains compatible
# with the newer CUDA runtime used by the workstation.
# The explicit source binding prevents unrelated packages from using the
# dedicated PyTorch index.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[tool.hatch.build.targets.wheel]
packages = ["src/lexiquest_voice"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: marks tests as integration tests.",
]
