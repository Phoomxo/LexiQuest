[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexiquest-voice-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.140.0",
    "firebase-admin==7.5.0",
    "pydantic-settings==2.14.2",
    "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
    "httpx2==2.9.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
gpu = [
    "omnivoice==0.2.1",
    "soundfile==0.14.0",
    "torch==2.8.0+cu128",
    "torchaudio==2.8.0+cu128",
]

# OmniVoice 0.2.1 is supported on the CUDA 12.8 runtime, so torch and
# torchaudio 2.8.0+cu128 wheels come from the dedicated PyTorch index. The
# explicit source bindings prevent unrelated packages from using this index.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.hatch.build.targets.wheel]
packages = ["src/lexiquest_voice"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: marks tests as integration tests.",
]
